# Nextcloud official image, SQLite via PHP pdo_sqlite.
# The database file Nextcloud opens is replaced with the broker stub.
# User files remain on the nextcloud volume. app.sqlite is only on the broker.
#
#   docker compose -f examples/apps/nextcloud/docker-compose.yml up --build
#
# pdo_sqlite in this image links libsqlite3.so. Grafana, Gitea, n8n, and
# Uptime Kuma do not. See docs/apps.md.

services:
  broker:
    build:
      context: ../../..
      dockerfile: Dockerfile
    image: sqlite-broker:0.1.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cp /usr/local/lib/libsqlite_broker.so /shim/libsqlite_broker.so
        cp /usr/local/lib/libsqlite_broker.so /shim/libsqlite3.so.0
        exec sqlite-broker serve \
          --storage /data/app.sqlite \
          --stub /stub/db.sqlite \
          --listen 0.0.0.0:7432 \
          --advertise broker:7432
    volumes:
      - sqlite-data:/data
      - stub:/stub
      - shim:/shim
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "test -s /stub/db.sqlite && test -s /shim/libsqlite3.so.0"]
      interval: 2s
      timeout: 3s
      retries: 30

  nextcloud:
    image: nextcloud:apache
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: change-me
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
      LD_PRELOAD: /shim/libsqlite_broker.so
      LD_LIBRARY_PATH: /shim
    volumes:
      - nextcloud:/var/www/html
      - shim:/shim:ro
      - stub:/etc/sqlite-broker:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /var/www/html/data
        cp /etc/sqlite-broker/db.sqlite /var/www/html/data/nextcloud.db
        chown www-data:www-data /var/www/html/data/nextcloud.db
        exec /entrypoint.sh apache2-foreground

volumes:
  sqlite-data:
  nextcloud:
  stub:
  shim:
