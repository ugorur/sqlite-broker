[package]
name = "sqlite-broker-shim"
version = "0.1.0"
edition = "2021"
description = "LD_PRELOAD shim that forwards sqlite3_open to sqlite-broker"
license = "MIT"
repository = "https://github.com/ugorur/sqlite-broker"

[lib]
name = "sqlite_broker"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
sqlite-broker-proto = { path = "../protocol" }
